# ============================================================================
# v1.3.2 · task_type 封闭取值（★ 数据，不是代码）
# ============================================================================
# 为什么有这个文件（2026-09-29 实测）
# ---------------------------------------------------------------------------
# 表头 `task_type` 实测 **380/482 = 78.8% 都是"闲聊"**，而它是 Phase1 的过滤维度 ——
# **拿它过滤等于不过滤**。逐层查下来，根因有两层：
#
#   第一层（数据）：392 条老数据（v1 迁移）的 task_type **不是当前代码写的**
#     —— 用当前规则重标，一致率只有 **1.8%（7/392）**。是历史遗留值。
#   第二层（规则）：当前用的 `_guess_task_type()` 是**关键词词面匹配 + 兜底"其他"**。
#     拿它重标 392 条，结果是 **其他 221（56%）** —— 一半以上落进兜底。
#     **换个坏法而已，不是修好了。**
#
# 所以要做两件：① 把取值收成一套**封闭词表**（本文件）② 把标引从"关键词匹配"
# 换成"**模型按判据判断**"。
#
# 为什么写成人话的「判据」而不是给「例子」
# ---------------------------------------------------------------------------
# LIS 的老教训：**没有编目规则的字段，等于没有字段。**
# 小模型不是不会填，是**没有规则可依，就挑了个默认值**。
# 给例子会让它抄例子（过拟合几个样本），给判据才会泛化。
#
# ★ 判据（离线可验，不用跑 LoCoMo）
#   - **单个取值占比 ≤ 40%**   （现在：闲聊 78.8% / 规则重标后：其他 56%）
#   - **「其他」占比 ≤ 10%**   （它是"规则没覆盖到"的计数器，高了说明判据有漏）
#
# 改这个文件不用动代码：`services/shared/task_types.py` 按 mtime 热加载。
# ============================================================================

version: v1.3.2

# 兜底取值。它**不是**一个正常类别，是"判据没覆盖到"的计数器。
fallback: 其他

# 判定顺序：先判最具体的，闲聊最后（因为它是"没有产出目标"的兜底语义）
order: [决策, 验证, 研究, 规划, 求助, 闲聊]

# ★ 标引视角（2026-09-29 试标 30 条后补的一节，很要紧）
# ---------------------------------------------------------------------------
# 第一版判据写的是"用户**想**干什么"（现在的意图）。实测错得很明显：
#   "决定采用简化版 JSONL 格式…"     → 判成「其他」（该是决策）
#   "确认冷/温/热记忆文档统一存储…"   → 判成「其他」（该是决策）
# 根因：**summary 是过去时的记录，不是提问时的意图**。判据按"意图"写，
# 凡是"记录了一件已经定下来的事"的条目就全部漏进兜底 → 「其他」占到 33%。
#
# 所以标引视角定为：**这条记忆记录的是哪一种活动**（回顾式），不是"用户想干什么"。
# 下面每条判据都按这个视角重写。摘要里的动词是有用的**线索**（不是规则）：
#   决定/改为/采用/放弃 → 决策 ｜ 测试/对比/确认/生效 → 验证
#   分析/查/搞清楚 → 研究     ｜ 设计/架构/路线/分步 → 规划
#   报错/要求动手/装/修  → 求助 ｜ 寒暄/情绪/感慨 → 闲聊

types:

  研究:
    goal: 搞懂一件事
    judge: |
      这条记忆记录了**把一件事搞清楚**：查资料、做调研、分析、比较若干个东西的优劣、
      弄明白某个技术/概念/方案是什么。**记录的是"理解"本身**，不是"定了什么"、
      也不是"核对对不对"。
      常见说法：分析…／调研…／…是什么／有没有更好的做法／讲讲原理。
    not: 如果记录的是"最后选了哪个" → 那是「决策」；如果记录的是"核对结果" → 那是「验证」。

  决策:
    goal: 定下来一件事
    judge: |
      这条记忆记录了**定下一件事**：从两个以上选项里选了一个、改掉了一个既有做法、
      放弃了一个方案、敲定了一个格式/路径/参数/策略。**重点是"定了"**。
      常见说法：决定…／改为…／采用…／放弃…／不再…／保留…／确认统一用…。
    not: 如果只是在比较还没定 → 那是「研究」；如果是在核对已定的事对不对 → 那是「验证」。

  验证:
    goal: 核对一件事对不对
    judge: |
      这条记忆记录了**对已有的结论、实现或数据做核对**：测试、跑一遍、对比、看效果、
      检查是不是真的、确认改动生效了没有、复现某个问题。**重点是"它到底对不对"**。
      常见说法：测试…／对比…／结果如何／是不是真的／生效了吗／有没有回退／复现…。
    not: 如果结论还没有、正在挑方案 → 那是「决策」。

  规划:
    goal: 画出将来长什么样
    judge: |
      这条记忆记录了**设计要做的东西**：定架构、排路线、分层、定阶段与工期、
      画流程、拆模块、列后续步骤。**重点是"将来长什么样、分几步做"**。
      常见说法：架构怎么设计／路线怎么排／分几步／需要多久／先做什么后做什么／分层。
    not: 如果是在挑一个具体选项 → 那是「决策」；如果记录的是"已经开始动手做了" → 那是「求助」。

  闲聊:
    goal: 没有推进任何事
    judge: |
      这条记忆**没有推进任何事**：交换感受、寒暄、问候、表达情绪、感慨、开玩笑。
      也包括纯粹的确认/附和（"好的""可以""继续"）。
      ★ **这个类别应该很少**。只要这条记忆在推进一件事（哪怕是抱怨某件事），就不算闲聊。
    not: 只要记录的是"想把某件事推进"，就归到上面五类里去。

  求助:
    goal: 出问题 / 要人动手
    judge: |
      这条记忆记录了**出问题、卡住，或者要求别人动手办一件事**：报错、闪退、装不上、
      跑不通，或者明确要求去改、去写、去装、去跑、去找。**重点是"这件事要别人做"**。
      常见说法：报错了／闪退／帮改一下／怎么装／你去做／修一下／弄不出来／要求…。
    not: 如果只是问原理 → 那是「研究」；如果是在选方案 → 那是「决策」。

  其他:
    goal: （兜底）
    judge: |
      以上六类都不是（例如：纯状态汇报、空壳记录、无信息的碎片）。
      ★ **这个取值是"判据没覆盖到"的计数器**：占比超过 10% 说明上面的判据有漏，
      应该回来补判据，而不是接受它。实测第一版判据下它占 33%，补了「标引视角」才降下来。

